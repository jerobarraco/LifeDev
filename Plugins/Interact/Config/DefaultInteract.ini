; for this to work, it needs to be copied to your project's config folder.
; actually this one works, and has precedence over the one in the project's config folder.
[/Script/Interact.CInteractor]
; 100 is not enough to reach to stuff on the floor
TraceLen=150
TraceSize=2

[/Script/Interact.Interact]
; -1 disabled. 0 the default
;HintPrimDataID=-1
;HintTime=1.5
;HintCurve=Objectpath

[/Script/Interact.Anim]
;ShouldCreate=false

[SectionsToSave]
bCanSaveAllSections=true
;https://forums.unrealengine.com/t/how-to-stop-local-custom-ini-files-being-deleted-after-play/1967813/2
;+Section=???
+Section=CurrentIniVersion

[CoreRedirects]
+FunctionRedirects=(OldName="/Script/Interact.CPuzzle.SetHintCondition",NewName="/Script/Interact.CPuzzle.SetHintConditions")
+PropertyRedirects=(OldName="/Script/Interact.CPuzzle.Interacts",NewName="/Script/Interact.CPuzzle.Pieces")
;+PropertyRedirects=(OldName="/Script/Interact.Interact.Locked",NewName="/Script/Interact.Interact.IsLocked")